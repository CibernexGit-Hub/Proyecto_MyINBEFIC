<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Jeremy Thomas — Frontend Designer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --deep-teal:#0a3d3a;
    --teal:#0f6e63;
    --emerald:#379600;
    --sky-blue:#003c8b; 
    --deep-blue:#0d2f6b;
    --ink:#eafff6;
    --accent:#00fff2;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(0, 109, 9, 0.25), transparent 45%),
      radial-gradient(circle at 85% 80%, rgb(218, 9, 9), transparent 48%),
      linear-gradient(135deg, var(--deep-blue) 0%, var(--sky-blue) 30%, var(--teal) 65%, var(--emerald) 100%);
  }

  .hero{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    overflow:hidden;
  }
li{
  color: white;
  font-size: 1.4rem;
  
}
  /* decorative geometric shapes,  echoing the original's angular panels */
  .shape{
    position:absolute;
    opacity:0.12;
    background:#ffffff;
  }
  .shape.s1{
    width:60%; height:140%;
    top:-20%; left:30%;
    clip-path: polygon(30% 0%, 55% 0%, 25% 100%, 0% 100%);
    background:linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0));
  }
  .shape.s2{
    width:45%; height:120%;
    top:-10%; left:38%;
    clip-path: polygon(40% 0%, 60% 0%, 35% 100%, 15% 100%);
    background:rgba(255,255,255,0.06);
  }

  .content{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:0 50px;
    gap:40px;
  }

  .text-block{
    max-width:760px;
  }

  h1{
    font-family:'Poppins', sans-serif;
    font-weight:300;
    font-size:4.7rem;
    color:#ffffff;
    letter-spacing:0.3px;
  }
  ul{
    font-size: 33px;
  }

  .role{
    margin-top:10px;
    font-family:'Poppins', sans-serif;
    font-size:1.8rem;
    font-weight:1000;
    letter-spacing:3px;
    color:var(--accent);
  }

  .divider{
    width:70px;
    height:3px;
    background:var(--accent);
    margin:20px 0 24px 0;
    border-radius:2px;
  }

  p.desc{
    font-size:15.15rem;
    line-height:1.6;
    color:rgba(234,255,246,0.9);
    font-weight:300;
    max-width:480px;
  }

  .cta{
    display:inline-block;
    margin-top:32px;
    padding:30px 64px;
    background:rgba(1, 16, 19, 0.836);
    border:1px solid rgba(61,232,192,0.5);
    border-radius:30px;
    color:var(--accent);
    font-family:'Poppins', sans-serif;
    font-size:1.8rem;
    font-weight:600;
    letter-spacing:2px;
    text-decoration:none;
    transition:background 0.25s ease, transform 0.25s ease;
  }
  .cta:hover{
    background:rgb(8, 255, 197);
    color: rgb(0, 0, 0);
    transform:translateY(-2px);
  }

  .socials{
    display:flex;
    gap:30px;
    margin-top:28px;
  }
  .socials a{
    width:60px; height:60px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    color:rgba(242, 248, 245, 0.75);
    text-decoration:none;
    font-size:3rem;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .socials a:hover{
    background:rgba(21, 230, 195, 0.507);
    color:#ffffff;
  }

  .avatar-wrap{
    position:relative;
    flex-shrink:0;
  }

  .avatar-ring{
    width:340px;
    height:340px;
    border-radius:50%;
    padding:6px;
    background:conic-gradient(from 180deg, var(--accent), var(--sky-blue), var(--emerald), var(--accent));
    box-shadow:0 20px 60px rgb(0, 0, 0);
  }

  .avatar{
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background:linear-gradient(135deg, var(--deep-teal), var(--deep-blue));
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(255,255,255,0.4);
    font-family:'Poppins', sans-serif;
    font-size:0.9rem;
    text-align:center;
    padding:20px;
  }

  @media (max-width: 1080px){
    .content{ flex-direction:column; text-align:center; padding:40px 24px; gap:50px; }
    .text-block{ max-width:100%; }
    .divider{ margin:20px auto 24px auto; }
    p.desc{ margin:0 auto;
    font-size:2.3rem; }
    .socials{ justify-content:center; }
    .avatar-ring{ width:600px; height:660px;  }
    h1{ font-size:5.1rem; }
    footer{
      font-size: 1.2rem;
    }
  }
</style>
<style>
  body{background:radial-gradient(circle at 15% 20%,rgba(23,107,88,.28),transparent 42%),radial-gradient(circle at 85% 80%,rgba(40,101,175,.32),transparent 45%),linear-gradient(135deg,#102f43,#146553 62%,#1d7a68)}
  .hero{padding:48px 0}
  .content{width:min(1120px,calc(100% - 40px));padding:clamp(24px,5vw,64px);gap:clamp(32px,6vw,80px);border:1px solid rgba(255,255,255,.2);border-radius:28px;background:rgba(8,27,40,.42);box-shadow:0 28px 80px rgba(5,24,36,.35);backdrop-filter:blur(12px)}
  .text-block{max-width:680px}
  .avatar-wrap{width:min(100%,480px);margin:0 auto}
  .avatar-ring{width:clamp(180px,28vw,300px);height:clamp(180px,28vw,300px);margin:0 auto;padding:5px;box-shadow:0 18px 54px rgba(0,0,0,.28)}
  .avatar{padding:0}
  .avatar img{width:100%;height:100%;max-width:100%;object-fit:cover}
  h1{margin-top:22px;font-size:clamp(2.1rem,5vw,4rem);font-weight:700}
  .role{font-size:clamp(1rem,2vw,1.3rem);letter-spacing:1.4px}
  p.desc{max-width:100%;font-size:clamp(1rem,1.6vw,1.2rem);line-height:1.8}
  .text-block ul{font-size:clamp(1rem,1.7vw,1.2rem);line-height:2}
  .text-block ul img{width:20px;height:20px;object-fit:contain;vertical-align:middle}
  .cta{margin-top:26px;padding:14px 32px;border:0;border-radius:12px;background:#fff;color:#12483f;font-size:1rem;letter-spacing:1px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
  .cta:hover{background:#ddf8ed;color:#12483f}
  footer{padding:0 20px 24px}
  footer .socials{justify-content:center;align-items:center;gap:clamp(14px,4vw,34px);margin:0}
  footer .socials p,footer .socials h2{margin:0;font-size:1rem!important}
  @media(max-width:700px){.hero{min-height:auto;padding:20px 0}.content{width:calc(100% - 28px);padding:28px 22px;gap:26px;text-align:center}.text-block{display:flex;flex-direction:column;align-items:center}.divider{margin:14px auto 18px}.socials{flex-wrap:wrap}}
</style>
</head>
<body>
  <section class="hero">
    <div class="shape s1"></div>
    <div class="shape s2"></div>

    <div class="content container-fluid">
      <div class="text-block">
          <div class="avatar-wrap">
        <div class="avatar-ring">
          <div class="avatar"><img src="MODELO.jpeg" height="650px" width="630px"  style="border-radius: 50%;
          " alt=""></div>
        </div>
        <h1>Nelson Montano </h1>
        <hr>
        <div class="role">PROFESOR DE INFORMATICA</div>
        <div class="divider"></div>
        <ul style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        gap: 70px;" class="desc"> 
        <img src="hecho.png" alt="" height="30px" width="30px"> Segundo A Software
          <br>
           <img src="hecho.png" alt="" height="30px" width="30px"> Tercero A Sfotware
        </ul>
        <a href="inicio%20de%20sesi%C3%B3n%20ultima%20version.html" class="cta">ENTRAR</a>
       
      </div>

    
      </div>
    </div>
  </section>
  <footer><div class="socials">
         <p style="font-size: larger;" >INBEFIC</p>
       <p style="font-size: larger;
       font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;"><h2>𝕏</h2></p>
         <p style="font-size: larger;">CIBERNEX</p>
        </div>
      </div></footer>
</body>
</html>
